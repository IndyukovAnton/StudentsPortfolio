<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Portfolio - Предложить работу</title>
	<link rel="stylesheet" href="../../styles/main.css">
	<link rel="stylesheet" href="../../styles/components/forms/add-work.css">
	<link rel="stylesheet" href="../../styles/components/notifications.css">
</head>
<body>
	<div class="preposition__container container">
		<a href="/StudentsPortfolio/" class="back">Вернуться</a>
		
		<form action="#" class="add-work" enctype="multipart/form-data" method="post">
			<input required type="text" name="author" placeholder="Автор" class="input__author input_field"/>
			<textarea type="text" name="comment" placeholder="Комментарий" class="input__comment input_field"></textarea>
			<select name="theme" class="input__theme input_field">
				<option value="0">Интересные</option>
				<option value="1">Тема 1</option>
				<option value="2">Тема 2</option>
				<option value="3">Тема 3</option>
				<option value="4">Тема 4</option>
				<option value="5">Тема 5</option>
				<option value="6">Тема 6</option>
				<option value="7">Тема 7</option>
				<option value="8">Тема 8</option>
				<option value="9">Тема 9</option>
				<option value="10">Тема 10</option>
				<option value="11">Тема 11</option>
				<option value="12">Тема 12</option>
				<option value="13">Тема 13</option>
				<option value="14">Тема 14</option>
				<option value="15">Тема 15</option>
				<option value="16">Тема 16</option>
				<option value="17">Тема 17</option>
				<option value="18">Тема 18</option>
				<option value="19">Тема 19</option>
				<option value="20">Тема 20</option>
				<option value="21">Тема 21</option>
				<option value="22">Тема 22</option>
				<option value="23">Тема 23</option>
				<option value="24">Тема 24</option>
				<option value="25">Тема 25</option>
				<option value="26">Тема 26</option>
				<option value="27">Тема 27</option>
				<option value="28">Тема 28</option>
				<option value="29">Тема 29</option>
				<option value="30">Тема 30</option>
				<option value="31">Тема 31</option>
				<option value="32">Тема 32</option>
			</select>
			<div class="input__photo-wrapper input__wrapper">
				<p class="add-work__header">Выберите обложку</p>
				<div class="custom__input-file-field">
					<label for="input-file-image">Выбери или перетащите фотографию</label>
					<input id="input-file-image" required type="file" name="photo" id="getPhoto" class="input__photo"/>
				</div>
				<img class="photo__preview">
			</div>
			<div class="input__file-wrapper input__wrapper">
				<p class="add-work__header">Добавьте проект</p>

				<div class="file_add_method">
					<div class="file__method__wrapper">
						<input id="file-method-link" class="file_method" name="project_method" type="radio" value="link" checked>
						<label for="file-method-link">Ссылка</label>
					</div>
					<div class="file__method__wrapper">
						<input id="file-method-file" class="file_method" name="project_method" type="radio" value="file">
						<label for="file-method-file">Файл</label>
					</div>
				</div>
				<input type="file" class="input__file"/>
				<input type="url" name="project" class="input__link" placeholder="Ссылка GitHub страницу проекта"/>

				<div class="file__info"></div>
			</div>

			<button class="button__send" type="submit">Отправить</button>
		</form>
	</div>
	<div class="notification"></div>
	<div class="notification"></div>

	<input style="display: none;" class="nekot" value="7413990657:AAHWA9DNhBNP_b6WLIb_wPnWypqk2xaNXD0">
	<script src="../../scripts/components/add-work.js" type="module"></script>
</body>
</html>
